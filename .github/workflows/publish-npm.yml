name: Publish npm package

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: publish-npm-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.package.outputs.publish }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Inspect package version
        id: package
        shell: bash
        run: |
          set -euo pipefail

          name=$(node --print "require('./package.json').name")
          version=$(node --print "require('./package.json').version")

          if [[ "$name" != "@chitresh-code/hush" ]]; then
            echo "Unexpected package name: $name" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( BASH_REMATCH[1] < 1 )); then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if published=$(npm view "$name@$version" version 2>&1); then
            echo "Version $version is already published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [[ "$published" == *"E404"* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$published" >&2
            exit 1
          fi

      - name: Pack package
        if: steps.package.outputs.publish == 'true'
        run: mkdir package && npm pack --pack-destination package

      - name: Upload package
        if: steps.package.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ steps.package.outputs.version }}
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ needs.verify.outputs.version }}
          path: package

      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(package/*.tgz)

          if (( ${#packages[@]} != 1 )); then
            echo "Expected one package archive, found ${#packages[@]}." >&2
            exit 1
          fi

          npm publish "${packages[0]}" --access public
