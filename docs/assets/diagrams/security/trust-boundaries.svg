<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1480 575" width="1480" height="575">
  <title>Hush trust boundaries</title>
  <desc>Proposed boundaries between user input, local protected storage, child processes, network, and service storage.</desc>
