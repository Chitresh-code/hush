<line x1="540" y1="265" x2="665" y2="485" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="855" y1="485" x2="980" y2="315" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="1075" y1="170" x2="1075" y2="275" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="1170" y1="315" x2="1250" y2="315" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="1075" y1="455" x2="1075" y2="355" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="45" y="150" width="190" height="80" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/>
<text x="140" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="140" dy="0">Authorized user</tspan></text>
