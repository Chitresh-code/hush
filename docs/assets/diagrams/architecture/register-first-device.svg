  <rect width="100%" height="100%" fill="#ffffff"/>
<text x="45" y="48" text-anchor="start" font-family="Arial, sans-serif" font-size="30" fill="#0f172a"><tspan x="45" dy="0">Register an account and first device</tspan></text>
