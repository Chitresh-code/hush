<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 935 681" width="935" height="681">
  <title>Revoke a device</title>
  <desc>Revoke a device, with conceptual messages rather than implemented API operations.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
<text x="45" y="48" text-anchor="start" font-family="Arial, sans-serif" font-size="30" fill="#0f172a"><tspan x="45" dy="0">Revoke a device</tspan></text>
<rect x="45" y="90" width="170" height="62" rx="10" fill="#fef3c7" stroke="#1e293b" stroke-width="2"/>
<text x="130" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0f172a"><tspan x="130" dy="0">Administrator</tspan></text>
<line x1="130" y1="152" x2="130" y2="646" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="270" y="90" width="170" height="62" rx="10" fill="#dcfce7" stroke="#1e293b" stroke-width="2"/>
<text x="355" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0f172a"><tspan x="355" dy="0">Authorized device</tspan></text>
<line x1="355" y1="152" x2="355" y2="646" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="495" y="90" width="170" height="62" rx="10" fill="#fef3c7" stroke="#1e293b" stroke-width="2"/>
<text x="580" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0f172a"><tspan x="580" dy="0">Hush service</tspan></text>
<line x1="580" y1="152" x2="580" y2="646" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="720" y="90" width="170" height="62" rx="10" fill="#fce7f3" stroke="#1e293b" stroke-width="2"/>
<text x="805" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0f172a"><tspan x="805" dy="0">Revoked device</tspan></text>
<line x1="805" y1="152" x2="805" y2="646" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="130" y1="205" x2="580" y2="205" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="207" y="183" width="296" height="20" fill="#ffffff"/>
<text x="355" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="355" dy="0">Revoke device</tspan></text>
<path d="M 580 263 h 70 v 34 h -70" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="658" y="241" width="312" height="20" fill="#ffffff"/>
<text x="662" y="256" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="662" dy="0">Mark device revoked and reject sessions</tspan></text>
<line x1="580" y1="321" x2="355" y2="321" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="319.5" y="299" width="296" height="20" fill="#ffffff"/>
<text x="467.5" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="467.5" dy="0">Return affected access grants</tspan></text>
<path d="M 355 379 h 70 v 34 h -70" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="433" y="357" width="240" height="20" fill="#ffffff"/>
<text x="437" y="372" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="437" dy="0">Rotate future environment keys</tspan></text>
<line x1="355" y1="437" x2="580" y2="437" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="319.5" y="415" width="296" height="20" fill="#ffffff"/>
<text x="467.5" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="467.5" dy="0">Upload replacement key envelopes</tspan></text>
<line x1="805" y1="495" x2="580" y2="495" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="544.5" y="473" width="296" height="20" fill="#ffffff"/>
<text x="692.5" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="692.5" dy="0">Request later versions</tspan></text>
<line x1="580" y1="553" x2="805" y2="553" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="544.5" y="531" width="296" height="20" fill="#ffffff"/>
<text x="692.5" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="692.5" dy="0">Deny</tspan></text>
</svg>
