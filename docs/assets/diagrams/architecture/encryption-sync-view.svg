<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1240 585" width="1240" height="585">
  <title>Hush encryption and synchronization</title>
  <desc>Plaintext and keys remain on authorized devices while ciphertext and wrapped keys synchronize.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="48" text-anchor="start" font-family="Arial, sans-serif" font-size="30" fill="#0f172a"><tspan x="40" dy="0">Hush encryption and synchronization</tspan></text>
<line x1="235" y1="190" x2="350" y2="225" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="235" y1="340" x2="350" y2="225" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="540" y1="225" x2="650" y2="225" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="235" y1="505" x2="350" y2="470" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="235" y1="340" x2="350" y2="470" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="540" y1="470" x2="650" y2="470" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="840" y1="225" x2="980" y2="350" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="840" y1="470" x2="980" y2="350" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="45" y="150" width="190" height="80" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/>
<text x="140" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="140" dy="0">Plaintext on device</tspan></text>
<rect x="45" y="300" width="190" height="80" rx="12" fill="#dcfce7" stroke="#1e293b" stroke-width="2"/>
<text x="140" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="140" dy="0">Data key</tspan></text>
<rect x="350" y="185" width="190" height="80" rx="12" fill="#fef3c7" stroke="#1e293b" stroke-width="2"/>
<text x="445" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="445" dy="0">Authenticated</tspan><tspan x="445" dy="22.5">encryption</tspan></text>
<rect x="650" y="185" width="190" height="80" rx="12" fill="#fce7f3" stroke="#1e293b" stroke-width="2"/>
<text x="745" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="745" dy="0">Encrypted payload</tspan></text>
<rect x="45" y="465" width="190" height="80" rx="12" fill="#e0e7ff" stroke="#1e293b" stroke-width="2"/>
<text x="140" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="140" dy="0">Authorized device</tspan><tspan x="140" dy="22.5">public key</tspan></text>
<rect x="350" y="430" width="190" height="80" rx="12" fill="#fef3c7" stroke="#1e293b" stroke-width="2"/>
<text x="445" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="445" dy="0">Key wrapping</tspan></text>
<rect x="650" y="430" width="190" height="80" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/>
<text x="745" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="745" dy="0">Wrapped key envelope</tspan></text>
<rect x="980" y="300" width="220" height="100" rx="12" fill="#dcfce7" stroke="#1e293b" stroke-width="2"/>
<text x="1090" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="1090" dy="0">Blind sync service</tspan></text>
</svg>
