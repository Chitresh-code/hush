<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1160 681" width="1160" height="681">
  <title>Recover without an enrolled device</title>
  <desc>Recover without an enrolled device, with conceptual messages rather than implemented API operations.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
<text x="45" y="48" text-anchor="start" font-family="Arial, sans-serif" font-size="30" fill="#0f172a"><tspan x="45" dy="0">Recover without an enrolled device</tspan></text>
<rect x="45" y="90" width="170" height="62" rx="10" fill="#fef3c7" stroke="#1e293b" stroke-width="2"/>
<text x="130" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0f172a"><tspan x="130" dy="0">User</tspan></text>
<line x1="130" y1="152" x2="130" y2="646" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="270" y="90" width="170" height="62" rx="10" fill="#dcfce7" stroke="#1e293b" stroke-width="2"/>
<text x="355" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0f172a"><tspan x="355" dy="0">Account service</tspan></text>
<line x1="355" y1="152" x2="355" y2="646" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="495" y="90" width="170" height="62" rx="10" fill="#fef3c7" stroke="#1e293b" stroke-width="2"/>
<text x="580" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0f172a"><tspan x="580" dy="0">New device</tspan></text>
<line x1="580" y1="152" x2="580" y2="646" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="720" y="90" width="170" height="62" rx="10" fill="#fce7f3" stroke="#1e293b" stroke-width="2"/>
<text x="805" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0f172a"><tspan x="805" dy="0">Recovery kit</tspan></text>
<line x1="805" y1="152" x2="805" y2="646" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="945" y="90" width="170" height="62" rx="10" fill="#e0e7ff" stroke="#1e293b" stroke-width="2"/>
<text x="1030" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0f172a"><tspan x="1030" dy="0">Hush service</tspan></text>
<line x1="1030" y1="152" x2="1030" y2="646" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="130" y1="205" x2="355" y2="205" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="94.5" y="183" width="296" height="20" fill="#ffffff"/>
<text x="242.5" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="242.5" dy="0">Recover account authentication</tspan></text>
<line x1="355" y1="263" x2="130" y2="263" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="94.5" y="241" width="296" height="20" fill="#ffffff"/>
<text x="242.5" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="242.5" dy="0">Restored account access</tspan></text>
<line x1="130" y1="321" x2="580" y2="321" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="207" y="299" width="296" height="20" fill="#ffffff"/>
<text x="355" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="355" dy="0">Start secret recovery</tspan></text>
<line x1="580" y1="379" x2="805" y2="379" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="544.5" y="357" width="296" height="20" fill="#ffffff"/>
<text x="692.5" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="692.5" dy="0">Read user-held recovery material</tspan></text>
<line x1="580" y1="437" x2="1030" y2="437" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="657" y="415" width="296" height="20" fill="#ffffff"/>
<text x="805" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="805" dy="0">Fetch encrypted recovery envelopes</tspan></text>
<line x1="1030" y1="495" x2="580" y2="495" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="657" y="473" width="296" height="20" fill="#ffffff"/>
<text x="805" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="805" dy="0">Authorized ciphertext and envelopes</tspan></text>
<path d="M 580 553 h 70 v 34 h -70" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="658" y="531" width="296" height="20" fill="#ffffff"/>
<text x="662" y="546" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#0f172a"><tspan x="662" dy="0">Decrypt locally and enroll new device</tspan></text>
</svg>
