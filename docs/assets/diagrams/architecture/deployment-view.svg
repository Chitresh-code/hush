<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1310 425" width="1310" height="425">
  <title>Hush deployment view</title>
  <desc>Local device and optional service deployment boundaries.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="48" text-anchor="start" font-family="Arial, sans-serif" font-size="30" fill="#0f172a"><tspan x="40" dy="0">Hush deployment view</tspan></text>
<rect x="65" y="90" width="580" height="350" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
<text x="79" y="116" text-anchor="start" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="79" dy="0">User macOS device</tspan></text>
<rect x="750" y="90" width="570" height="350" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
<text x="764" y="116" text-anchor="start" font-family="Arial, sans-serif" font-size="16" fill="#0f172a"><tspan x="764" dy="0">Self-hosted or managed service</tspan></text>
<line x1="300" y1="195" x2="380" y2="145" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="300" y1="195" x2="380" y2="245" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="300" y1="195" x2="380" y2="345" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="300" y1="195" x2="805" y2="225" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<line x1="995" y1="225" x2="1080" y2="225" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="110" y="155" width="190" height="80" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/>
<text x="205" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="205" dy="0">Hush process</tspan></text>
<rect x="380" y="105" width="190" height="80" rx="12" fill="#dcfce7" stroke="#1e293b" stroke-width="2"/>
<text x="475" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="475" dy="0">Encrypted vault</tspan></text>
