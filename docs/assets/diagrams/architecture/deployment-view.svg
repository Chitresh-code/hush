<text x="475" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0f172a"><tspan x="475" dy="0">Application process</tspan></text>
<rect x="805" y="185" width="190" height="80" rx="12" fill="#e0e7ff" stroke="#1e293b" stroke-width="2"/>
